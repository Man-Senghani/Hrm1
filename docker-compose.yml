services:
  # ========================================================
  # 1. Production Service (hrm.aupanishad.tech)
  # ========================================================
  app_production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluidhr-production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - hrm_uploads_prod:/app/backend/uploads
    expose:
      - "5000"
    networks:
      - hrm-network

  # ========================================================
  # 2. Staging Service (hrm-staging.aupanishad.tech)
  # ========================================================
  app_staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluidhr-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - PORT=5000
      - NODE_ENV=staging
    volumes:
      - hrm_uploads_staging:/app/backend/uploads
    expose:
      - "5000"
    networks:
      - hrm-network

  # ========================================================
  # 3. Nginx Gateway (Routes domains to respective containers)
  # ========================================================
  web:
    image: nginx:alpine
    container_name: fluidhr-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app_production
      - app_staging
    networks:
      - hrm-network

# ==========================================================
# Named Persistent Storage (Separate volumes for Prod & Staging)
# ==========================================================
volumes:
  hrm_uploads_prod:
    name: fluidhr_uploads_production
  hrm_uploads_staging:
    name: fluidhr_uploads_staging

networks:
  hrm-network:
    driver: bridge
