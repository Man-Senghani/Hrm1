name: Auto-Deploy to BigRock VPS

on:
  push:
    branches:
      - Master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Connect to VPS and Update Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/hrm
            git checkout Master
            git fetch origin Master
            git reset --hard origin/Master
            if [ -f .env ]; then rm -f .env; fi
            if [ -f secrets.env ]; then
              cat secrets.env >> .env.production
              cat secrets.env >> .env.staging
            fi
            docker compose down
            docker compose up --build --force-recreate -d
            echo "✅ FluidHR auto-deploy completed successfully!"
