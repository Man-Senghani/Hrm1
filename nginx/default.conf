map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================================================
# 0. Global HTTP to HTTPS Redirection (Port 80 -> Port 443)
# =========================================================
server {
    listen 80 default_server;
    server_name hrm.aupanishad.tech hrm-staging.aupanishad.tech 66.116.252.114 "";

    # Allow Let's Encrypt renewal validation over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================
# 1. Production Environment: https://hrm.aupanishad.tech
# =========================================================
server {
    listen 443 ssl default_server;
    server_name hrm.aupanishad.tech 66.116.252.114;

    ssl_certificate /etc/letsencrypt/live/hrm.aupanishad.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrm.aupanishad.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Socket.io WebSockets
    location /socket.io/ {
        proxy_pass http://app_production:5000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API & Static SPA
    location / {
        proxy_pass http://app_production:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

